name: slow-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  slow-tests:
    name: slow-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build AirportSim.sln -c Release --nologo -warnaserror
      - name: Slow tests
        run: dotnet test AirportSim.sln -c Release --nologo --no-build --filter "Category=Slow"