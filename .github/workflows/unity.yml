name: Unity

# Build-only check of the Unity shell and backends (spec 15 §15.3, 16 §16.2, 17 §17.2).
# NOT a required status check, and not a determinism gate: those run with no engine
# and no licence (spec/01). Skips cleanly until unity/AirportSim/ exists (T-034).
#
# Secrets (Unity Personal): UNITY_EMAIL, UNITY_PASSWORD of a CI-only Unity account without 2FA.
# Unity no longer issues .ulf files for Personal seats; unity-builder@v6 activates online.

on:
  pull_request:
    branches: [main]
    paths: ['unity/**', 'src/app/**', '.github/workflows/unity.yml']
  push:
    branches: [main]
    paths: ['unity/**', 'src/app/**', '.github/workflows/unity.yml']
  schedule:
    - cron: '0 4 * * *'   # catches sim-side breakage; after nightly/slow-tests at 03:00
  workflow_dispatch:

# One Unity run at a time repo-wide: a Personal licence has few concurrent seats.
# GitHub keeps only the newest pending run per group, so a queued run can be superseded.
concurrency:
  group: unity
  cancel-in-progress: false

env:
  PROJECT: unity/AirportSim

jobs:
  unity-build:
    name: unity-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      smoke_ran: ${{ steps.smoke.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      - name: Is there a Unity project yet?
        id: project
        run: |
          if [ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $PROJECT/ProjectSettings/ProjectVersion.txt yet (T-034); skipping."
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.project.outputs.exists
        with:
          dotnet-version: '8.0.x'

      # §16.2: plugins are the Release build of the solution's netstandard2.1
      # assemblies, copied in at build time and never committed.
      - name: Build plugins into Assets/Plugins/AirportSim
        if: steps.project.outputs.exists
        run: |
          dotnet build AirportSim.sln -c Release
          dest="$PROJECT/Assets/Plugins/AirportSim"
          mkdir -p "$dest"
          find src -path '*/bin/Release/netstandard2.1/*.dll' -exec cp {} "$dest/" \;
          ls -l "$dest"

      - uses: actions/cache@v4
        if: steps.project.outputs.exists
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-${{ hashFiles('unity/AirportSim/Packages/**', 'unity/AirportSim/ProjectSettings/**') }}
          restore-keys: unity-library-

      - uses: game-ci/unity-builder@v6
        if: steps.project.outputs.exists
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          targetPlatform: StandaloneLinux64
          buildName: AirportSim
          # unityVersion defaults to 'auto': read from ProjectVersion.txt

      # §16.7 batch mode: one sim-day of checkpoints, exit code 0, dump header present.
      # Runs once T-034 ships the bootstrap and StreamingAssets/Scenario/; the skeleton has neither.
      - name: Smoke - headless checkpoint day
        id: smoke
        if: steps.project.outputs.exists && hashFiles('unity/AirportSim/Assets/StreamingAssets/Scenario/**') != ''
        run: |
          player=build/StandaloneLinux64/AirportSim
          sudo chmod -R a+rwX build
          "$player" -batchmode -nographics -logFile - -airportsim-checkpoints 1 "$PWD/checkpoints.txt"
          head -3 checkpoints.txt
          head -1 checkpoints.txt | grep -qx 'airport-sim-checkpoints 1'
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # §16.9 input for the cross-runtime job: the player's dump + the bundle the build packed.
      - uses: actions/upload-artifact@v4
        if: steps.smoke.outputs.ran == 'true'
        with:
          name: cross-runtime-input
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            checkpoints.txt
            build/StandaloneLinux64/AirportSim_Data/StreamingAssets/Scenario/
            build/StandaloneLinux64/AirportSim_Data/StreamingAssets/Content/

  # §16.9 (Q-115, owner 2026-10-06): player dump == harness dump, byte for byte.
  # Separate, non-required job: red here is a determinism bug for the owner and
  # never turns unity-build red. No Unity licence needed.
  cross-runtime:
    name: cross-runtime
    needs: unity-build
    if: needs.unity-build.outputs.smoke_ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build AirportSim.sln -c Release
      - uses: actions/download-artifact@v4
        with:
          name: cross-runtime-input
          path: ${{ runner.temp }}/cross-runtime-input
      - name: Player dump equals harness dump
        run: |
          IN="$RUNNER_TEMP/cross-runtime-input"
          S="$IN/build/StandaloneLinux64/AirportSim_Data/StreamingAssets"
          P="$IN/checkpoints.txt"
          H="$RUNNER_TEMP/harness-checkpoints.txt"
          for f in "$P" "$S/Scenario" "$S/Content"; do
            [ -e "$f" ] || { echo "FAIL cross_runtime missing $f"; exit 1; }
          done
          rm -f "$H"
          set +e
          dotnet run --project tools/SimHarness -c Release --no-build -- checkpoints \
            --bundle "$S/Scenario" --content "$S/Content" --days 1 --out "$H" \
            > "$RUNNER_TEMP/harness.out" 2> "$RUNNER_TEMP/harness.err"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "FAIL cross_runtime harness exit=$code"; cat "$RUNNER_TEMP/harness.err"; exit 1
          fi
          if ! grep -q '^WROTE checkpoints ' <(head -1 "$RUNNER_TEMP/harness.out"); then
            echo "FAIL cross_runtime harness no WROTE line"; cat "$RUNNER_TEMP/harness.out"; exit 1
          fi
          if cmp -s "$H" "$P"; then
            echo "PASS cross_runtime days=1"; exit 0
          fi
          # first differing line, 1-based; if one file is a prefix of the other, the line after it
          n=$(cmp "$H" "$P" 2>&1 | sed -n 's/.* differ: .* line \([0-9]*\).*/\1/p')
          if [ -z "$n" ]; then
            a=$(wc -l < "$H"); b=$(wc -l < "$P"); n=$(( (a < b ? a : b) + 1 ))
          fi
          h=$(sed -n "${n}p" "$H"); p=$(sed -n "${n}p" "$P")
          [ "$(wc -l < "$H")" -ge "$n" ] || h='<missing>'
          [ "$(wc -l < "$P")" -ge "$n" ] || p='<missing>'
          echo "FAIL cross_runtime days=1 line=$n"
          echo "harness: $h"
          echo "player:  $p"
          exit 1
